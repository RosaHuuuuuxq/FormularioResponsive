<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">
    <title>Login</title>
</head>
<body>
    <form class="formulario">
        <h1>Login de Usuario</h1>
        <div class="contenedor">  
            <div class="input-contenedor">
                <img class="icon" src="icons/correo.png">
                <input type="text" placeholder="Correo Electrónico">
            </div>
            <div class="input-contenedor">
                <img class="icon" src="icons/contrasena.png">
                <input type="password" placeholder="Contraseña">
            </div>
            <input type="submit" value="Login" class="button">
            <p>Al registrarse, acepta nuestras condiciones de uso y política de privacidad</p>
            <p>¿No tiene una cuenta? <a class="link" href="Registro.html">Registrate</a></p>

        </div>

    </form>
</body>
</html>
